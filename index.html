<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Travel Planner</title>
  </head>
  <body>
    
    <div id = "accueil">
    <h1>Travel Planner</h1>
    <p>Organisez vos voyages à plusieurs.</p>

    <button id="createPlanningBtn"> Créer un planning</button>
      
      <div>  
      <input id="joinPlanningCode" type="text" placeholder="Code du planning" />
      <button id="joinPlanningBtn">Rejoindre</button>  
      </div>  
    </div>

    <div id = "errorMessage"> 
      <p>Code Invalide - Le code doit contenir 6 caractères (A–Z, 0–9)</p>
    </div>
    
    <div id = "planning">
      <h1>Planning du x au xx</h1>
      <div class = "planning-header">
        <div id = "heures" > Heures </div>
        <div id = "jour1" > Jour 1 </div>
        <div id = "jour2" > Jour 2 </div>
        <div id = "jour3" > Jour 3 </div>
      </div>
      
      <div class="planning-row">
        <div class="planning-hour">Matinée</div>
        <div class="planning-cell"></div>
        <div class="planning-cell"></div>
        <div class="planning-cell"></div>
      </div>
    
      <div class="planning-row">
        <div class="planning-hour">Déjeuner</div>
        <div class="planning-cell"></div>
        <div class="planning-cell"></div>
        <div class="planning-cell"></div>
      </div>
    
      <div class="planning-row">
        <div class="planning-hour">Après-midi</div>
        <div class="planning-cell"></div>
        <div class="planning-cell"></div>
        <div class="planning-cell"></div>
      </div>

    
    <script src="script.js"></script>
  </body>
</html>
